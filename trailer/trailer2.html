<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BAUBC Trailer v2</title>
<link rel="stylesheet" href="base.css">
<style>
@font-face{font-family:AnekBn;src:url(fonts/AnekBangla-700-bn.woff2);font-weight:700}
@font-face{font-family:HindBn;src:url(fonts/HindSiliguri-400-bn.woff2);font-weight:400}
@font-face{font-family:HindBn;src:url(fonts/HindSiliguri-600-bn.woff2);font-weight:600}
.bn{font-family:HindBn,Int,sans-serif}
.bnd{font-family:AnekBn,Bric,sans-serif;font-weight:700;letter-spacing:0;line-height:1.25}
.scene{position:absolute;inset:0;transform-origin:960px 540px;will-change:transform,filter,opacity}
.bframe{position:absolute;border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:0 70px 130px -50px rgb(1 50 25/.55),0 0 0 1px rgb(255 255 255/.7)}
.bchrome{position:absolute;left:0;top:0;right:0;height:42px;background:rgb(255 255 255/.86);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;z-index:5}
.bchrome i{width:11px;height:11px;border-radius:9px;display:inline-block;margin-right:6px}
.url{height:28px;min-width:360px;border-radius:9px;background:rgb(10 32 21/.06);display:flex;align-items:center;justify-content:center;gap:8px;font:500 13px Int;color:var(--ink-2);margin:0 auto}
.sk{border-radius:8px;background:rgb(10 32 21/.08)}
.hlx{font-weight:600;color:var(--ink);padding:.05em .15em;border-radius:.25em;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(100deg,rgb(201 245 59/0) 0%,rgb(201 245 59/.9) 3%,rgb(224 255 115/.95) 97%,rgb(224 255 115/0) 100%) no-repeat 0 85%/0% 75%}
.phone{position:absolute;width:400px;height:866px;border-radius:56px;overflow:hidden;background:var(--paper);box-shadow:0 70px 120px -40px rgb(0 0 0/.5)}
.phone::after{content:"";position:absolute;inset:0;border-radius:56px;border:12px solid #0A140E;pointer-events:none}
.phone .notch{position:absolute;left:50%;top:10px;width:120px;height:32px;border-radius:99px;background:#0A140E;transform:translateX(-50%);z-index:3}
.rc{position:absolute;border-radius:26px;overflow:hidden;box-shadow:0 40px 70px -30px rgb(1 50 25/.6)}
.chip2{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;font:600 15px Int;border:1.5px solid rgb(10 32 21/.18);background:rgb(255 255 255/.7)}
.chip2.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dcard{position:absolute;border-radius:20px;padding:20px;background:rgb(255 255 255/.7);border:1.5px solid var(--line)}
.dcard.on{border-color:var(--brand);background:linear-gradient(160deg,#fff,#F2FFC6);box-shadow:0 18px 36px -24px rgb(1 103 55/.55)}
.field2{height:50px;border-radius:14px;border:1.5px solid rgb(10 32 21/.18);background:#fff;display:flex;align-items:center;padding:0 16px;font:500 17px Int}
.lbl2{font:600 13px Int;color:var(--ink-2);margin-bottom:6px}
</style></head>
<body><div id="stage"></div>
<script src="lib.js"></script>
<script>
// ═════════════════════════════ timing (128 BPM) ═════════════════════════════
const BPM=128, B=60/BPM, BAR=4*B;
const bt=(bar,beat=0)=>(bar*4+beat)*B;
const DUR=72;
const SCN={intro:[0,2],hero:[2,4],routes:[4,8],events:[8,12],bangla:[12,16],reels:[16,19],profile:[19,22],dash:[22,25],perks:[25,28],contact:[28,31],mobile:[31,34],outro:[34,38]};
const T=(k)=>[bt(SCN[k][0]),bt(SCN[k][1])];

// ═════════════════════════════ content builders ═════════════════════════════
const ROUTES=[
 ['/','Plant ideas. Harvest founders.','hero'],['/about','About BAUBC','text'],['/events','What\'s on next','grid'],['/events/event-2','Event 2: Innovation Summit','event'],
 ['/insights','Insights','grid'],['/insights/bangla-article','কৃষির সমস্যাই পরের বড় ব্যবসা','bn'],['/reels','BAUBC, in motion.','reels'],['/wings','Six wings','wings'],
 ['/members','The people doing the work','people'],['/members/member-a','Member A','profile'],['/leaderboard','Leaderboard','board'],['/gallery','Gallery','gallery'],
 ['/resources','Resources','list'],['/advisors','Advisors','people'],['/join','Join BAUBC','form'],['/contact','Talk to a real person.','form'],['/verify','Verify a certificate','verify'],['/privacy','Privacy','text']];
function miniPage([path,title,kind],i){
  const tone=['#EEFFB3','#C5F4D4','#E0FF73','#DDF6E3'][i%4];
  let body='';
  const skl=(w,h=12,m=10)=>`<div class="sk" style="width:${w}%;height:${h}px;margin-top:${m}px"></div>`;
  if(kind==='grid'||kind==='gallery') body=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px">${[1,2,3].map(n=>`<div style="border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 20px -14px rgb(1 77 42/.4)"><div style="position:relative;height:${kind==='gallery'?190:130}px">${kind==='grid'?banner(n):cover(n)}</div>${kind==='grid'?`<div style="padding:12px">${skl(70,12,0)}${skl(45,10)}</div>`:''}</div>`).join('')}</div>`;
  else if(kind==='people') body=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px">${'ABCDEF'.split('').map(l=>`<div style="display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:#fff">${av(l,48)}<div style="flex:1"><div style="font:700 15px Bric">Member ${l}</div>${skl(80,9,7)}</div></div>`).join('')}</div>`;
  else if(kind==='profile') body=`<div style="display:flex;gap:30px;align-items:center;margin-top:20px">${av('A',150,'border-radius:30%;font-size:66px')}<div style="flex:1"><div class="tag" style="background:#0A2015;color:#E0FF73">★ Member of the Month</div>${skl(60,14,16)}${skl(40)}</div><div style="display:grid;gap:10px">${['1,240','#1','9'].map(v=>`<div style="padding:12px 18px;border-radius:16px;background:#fff;font:700 26px Bric">${v}</div>`).join('')}</div></div>`;
  else if(kind==='board') body=`<div style="margin-top:20px;display:grid;gap:10px">${'ACBDE'.split('').map((l,j)=>`<div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:${j?'#fff':'#EEFFB3'}"><b style="width:22px;font:700 18px Bric">${j+1}</b>${av(l,34)}<b style="font:600 15px Int">Member ${l}</b><b style="margin-left:auto;font:700 15px Int">${1240-j*90}</b></div>`).join('')}</div>`;
  else if(kind==='event') body=`<div style="position:relative;height:200px;border-radius:18px;overflow:hidden;margin-top:18px">${banner(2)}</div>${skl(55,16,18)}${skl(80)}`;
  else if(kind==='reels') body=`<div style="display:flex;gap:14px;margin-top:22px;align-items:flex-end">${[0,1,2,3,4].map(n=>`<div style="position:relative;flex:none;width:${n%2?260:140}px;height:${n%2?146:250}px;border-radius:18px;overflow:hidden">${reelArt(n)}</div>`).join('')}</div>`;
  else if(kind==='wings') body=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px">${[1,2,3,4,5,6].map(n=>`<div style="padding:18px;border-radius:16px;background:#fff"><div style="width:40px;height:40px;border-radius:12px;background:${['#EEFFB3','#DCE8FB','#FFF1CC','#DDF6E3','#FBE1DC','#E8ECDD'][n-1]}"></div><div style="font:700 16px Bric;margin-top:10px">Wing ${n}</div>${skl(80,9,8)}</div>`).join('')}</div>`;
  else if(kind==='form'||kind==='verify') body=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;max-width:760px">${[0,1,2,3].map(()=>`<div><div class="sk" style="width:40%;height:9px"></div><div style="height:44px;border-radius:12px;background:#fff;border:1.5px solid rgb(10 32 21/.14);margin-top:8px"></div></div>`).join('')}</div><div style="margin-top:18px;width:200px;height:48px;border-radius:99px;background:#0A2015"></div>`;
  else if(kind==='bn') body=`<div class="bn" style="font-size:19px;line-height:1.9;color:var(--ink-2);margin-top:20px;max-width:780px">বাংলাদেশের কৃষক প্রতিদিন এমন অনেক সমস্যার মুখোমুখি হন। <span class="hlx" style="background-size:100% 75%">প্রতিটি অপূর্ণ চাহিদাই আসলে একটি ব্যবসার সম্ভাবনা।</span></div>`;
  else body=`${skl(90)}${skl(84)}${skl(88)}${skl(60)}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px">${[0,1,2].map(()=>`<div style="height:110px;border-radius:16px;background:#fff"></div>`).join('')}</div>`;
  const big=kind==='hero';
  return `<div class="bframe" style="left:0;top:0;width:1200px;height:720px">
    <div class="bchrome"><span><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><div class="url">🔒 baubc &nbsp;${path==='/'?'/':path.replace(/\//g,' / ').replace(/^ \/ /,'/ ')}</div><span style="width:40px"></span></div>
    <div style="position:absolute;inset:42px 0 0;background:radial-gradient(60% 70% at 12% 10%,${tone},transparent 60%),var(--paper)">
      <div style="position:absolute;inset:0;background-image:var(--pat);opacity:.55"></div>
      <div style="position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line)"><span style="display:flex;gap:8px;align-items:center">${markSVG('#016737',26)}<b class="disp" style="font-size:18px">BAUBC</b></span><span style="display:flex;gap:18px;font:500 12px Int;color:var(--ink-2)">${['About','Events','Insights','Reels','Wings','Members','Contact'].map(x=>`<span>${x}</span>`).join('')}</span><span style="width:70px;height:30px;border-radius:9px;background:var(--ink)"></span></div>
      <div style="position:absolute;left:56px;right:56px;top:96px">
        <div class="lbl" style="color:var(--leaf)">◆ ${path==='/'?'Home':path.split('/')[1]}</div>
        <div class="${kind==='bn'?'bnd':'disp'}" style="font-size:${big?86:kind==='bn'?54:58}px;margin-top:10px;max-width:${big?900:1000}px">${title}</div>
        ${body}
      </div>
      ${big?`<div style="position:absolute;right:60px;top:150px;width:300px;height:300px;transform:rotate(45deg);border-radius:40px;background:var(--grad-lime)"></div><div style="position:absolute;right:120px;top:210px">${markSVG('#016737',180)}</div>`:''}
    </div></div>`;
}
function reelArt(n){
  const pal=[['#016737','#014D2A','#E0FF73'],['#F5B63A','#F07F3C','#3A1A00'],['#1D5FD1','#0E2E6E','#DCE8FB'],['#C9F53B','#8FDD55','#0A2015'],['#5B3FD1','#2A1B6E','#E0FF73'],['#0E7C86','#073B40','#C5F4D4']][n%6];
  const titles=['Event 2 recap','Pitch in 60s','Case study','Behind the scenes','Summit highlights','Meet the wings'];
  return `<div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 80% 0%,${pal[0]},${pal[1]} 70%);color:${pal[2]};overflow:hidden">
    <div style="position:absolute;inset:0;background-image:var(--rays-l);opacity:.9"></div>
    <div style="position:absolute;right:-18%;top:8%;width:70%;aspect-ratio:1;transform:rotate(45deg);border-radius:18%;background:rgb(255 255 255/.12)"></div>
    <div style="position:absolute;left:10%;top:12%;opacity:.95">${markSVG(pal[2],60)}</div>
    <div class="disp" style="position:absolute;right:8%;bottom:30%;font-size:120px;color:transparent;-webkit-text-stroke:2px ${pal[2]};opacity:.4">0${n+1}</div>
    <div style="position:absolute;left:8%;right:8%;bottom:8%;color:#fff"><div style="display:inline-block;padding:4px 10px;border-radius:99px;background:rgb(255 255 255/.18);font:600 11px Int">${(n+2)*1.3|0}.${n}K views</div><div class="disp" style="font-size:22px;margin-top:8px;letter-spacing:-.01em">${titles[n%6]}</div></div>
    <div style="position:absolute;right:8%;top:6%;width:40px;height:40px;border-radius:99px;background:#C9F53B;display:grid;place-items:center;color:#0A2015;font-size:16px">▶</div>
  </div>`;
}

// ═════════════════════════════ DOM ═════════════════════════════
const st=$('stage');
st.innerHTML=`
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEFF9E"/><stop offset=".45" stop-color="#D4FA4E"/><stop offset="1" stop-color="#8FDD55"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 ${Object.keys(SCN).map(k=>`<filter id="mb-${k}" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg-${k}" stdDeviation="0 0"/></filter>`).join('')}
</defs></svg>
<div id="bgDark" class="layer" style="background:radial-gradient(120% 90% at 50% 40%,#0B4A2A 0%,#032213 55%,#010D06 100%)"><div class="layer" style="background-image:var(--rays-l);opacity:.5"></div></div>
<div id="bgLime" class="layer" style="background:radial-gradient(70% 80% at 18% 12%,#E9FFA0 0%,transparent 60%),radial-gradient(60% 70% at 92% 30%,#D2F76A 0%,transparent 60%),linear-gradient(180deg,#EFFBC4,#F5F8EC)"><div class="layer" style="background-image:var(--pat);opacity:.6"></div></div>
<div id="leaks" class="layer" style="mix-blend-mode:screen;pointer-events:none"><div id="leak1" class="abs" style="width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgb(224 255 115/.35),transparent 65%)"></div><div id="leak2" class="abs" style="width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgb(31 168 91/.4),transparent 65%)"></div></div>
<div id="bokeh" class="layer"></div>
<div id="world" class="layer" style="transform-origin:960px 540px">

<!-- ── 1 INTRO ── -->
<div id="sc-intro" class="scene"><div id="iz" class="layer" style="transform-origin:1045px 346px">
  <svg class="abs" style="left:730px;top:200px;overflow:visible" width="460" height="460" viewBox="150 120 760 760">
   <g id="iglow" filter="url(#glow)" opacity="0">${MARK.map(d=>`<path fill="#C9F53B" d="${d}"/>`).join('')}</g>
   ${MARK.map((d,i)=>`<path id="ip${i}" d="${d}" fill="url(#gl)" style="transform-box:fill-box;transform-origin:center"/>`).join('')}
  </svg>
  <div id="iwm" class="abs disp" style="left:0;right:0;top:700px;text-align:center;font-size:170px;color:#fff;letter-spacing:.02em">${'BAUBC'.split('').map(c=>`<span class="w iwl">${c}</span>`).join('')}</div>
</div></div>

<!-- ── 2 HERO ── -->
<div id="sc-hero" class="scene">
  <div id="hb" class="bframe" style="left:160px;top:70px;width:1600px;height:900px">
    <div class="bchrome" id="hchrome"><span><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><div class="url">🔒 baubc &nbsp;/</div><span style="width:40px"></span></div>
    <div class="layer" style="top:42px;background:radial-gradient(60% 70% at 15% 20%,#E7FF8F,transparent 62%),radial-gradient(50% 60% at 85% 40%,#CDF55A,transparent 62%),radial-gradient(60% 50% at 60% 100%,#C5F4D4,transparent 60%),linear-gradient(180deg,#EEFBC2,#F5F8EC)"><div class="layer" style="background-image:var(--pat);opacity:.7"></div>
      <div class="abs" style="left:0;right:0;top:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid var(--line)"><span style="display:flex;gap:10px;align-items:center">${markSVG('#016737',34)}<b class="disp" style="font-size:24px">BAUBC</b></span><span style="display:flex;gap:28px;font:500 15px Int;color:var(--ink-2)">${['About','Events','Insights','Reels','Wings','Members','Contact'].map(x=>`<span>${x}</span>`).join('')}</span><span class="btn bp" style="height:42px;font-size:14px">Join →</span></div>
      <div class="abs" style="left:90px;top:170px;width:820px">
        <span id="h0" class="tag glass" style="color:var(--brand)"><span class="dia"></span>Bangladesh Agricultural University Business Club</span>
        <div class="disp" style="font-size:136px;margin-top:30px"><div id="h1">Plant ideas.</div><div id="h2"><span class="serif" style="color:var(--brand)">Harvest</span> founders.</div></div>
        <p id="h3" style="font-size:21px;line-height:1.55;color:var(--ink-2);max-width:640px;margin-top:26px">The student-run innovation ecosystem at BAU, where agriculture, technology and business strategy meet.</p>
        <div id="h4" style="display:flex;gap:14px;margin-top:28px"><span class="btn bp">Join the club →</span><span class="btn bs">See what's on</span></div>
      </div>
      <div id="hart" class="abs" style="left:980px;top:140px;width:560px;height:600px">
        <div class="abs" style="left:60px;top:40px;width:470px;height:470px;transform:rotate(45deg);border-radius:60px;background:var(--grad-lime);box-shadow:0 60px 90px -40px rgb(1 103 55/.5)"></div>
        <div class="abs" style="left:150px;top:130px">${markSVG('#016737',290)}</div>
      </div>
    </div>
  </div>
  <div id="hc1" class="abs glass" style="left:1180px;top:200px;width:290px;border-radius:22px;padding:16px 18px"><div class="lbl" style="color:var(--leaf)">◆ Next up</div><div class="disp" style="font-size:22px;margin-top:6px">Event 2 · Innovation Summit</div><div style="font-size:14px;color:var(--muted);margin-top:4px">Dec 12 · Main Hall</div></div>
  <div id="hc2" class="abs glass" style="left:1500px;top:640px;width:250px;border-radius:22px;padding:16px 18px"><div class="lbl">Live seats</div><div style="display:flex;align-items:baseline;gap:8px"><span class="disp tnum" style="font-size:44px">128</span><span style="font-size:14px;color:var(--muted)">/ 300</span></div></div>
  <div id="hc3" class="abs glass" style="left:120px;top:760px;width:300px;border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center">${av('A',44)}<div><div class="lbl" style="color:var(--leaf)">★ Member of the Month</div><b style="font:700 16px Bric">Member A</b></div></div>
</div>

<!-- ── 3 ROUTES ── -->
<div id="sc-routes" class="scene">
  ${ROUTES.map((r,i)=>`<div id="rt${i}" class="abs" style="left:360px;top:180px;width:1200px;height:720px;transform-origin:600px 360px">${miniPage(r,i)}</div>`).join('')}
  <div id="rlabel" class="abs mono" style="left:110px;bottom:120px;font-size:64px;color:#0A2015;letter-spacing:-.02em"></div>
  <div id="rcount" class="abs mono" style="right:110px;top:110px;font-size:22px;color:#016737;font-weight:600"></div>
  <div id="rtitle" class="abs disp" style="left:0;right:0;top:360px;text-align:center;font-size:132px;color:#0A2015;text-shadow:0 0 60px rgb(245 248 236),0 0 30px rgb(245 248 236),0 0 12px rgb(245 248 236)"><span id="rt1w">18 public pages.</span><br><span id="rt2w" class="serif" style="color:#016737;font-size:110px">Open to everyone.</span></div>
</div>

<!-- ── 4 EVENTS + GOOGLE FORM ── -->
<div id="sc-events" class="scene">
  <div id="eb" class="bframe" style="left:160px;top:70px;width:1600px;height:900px;transform-origin:800px 450px">
    <div class="bchrome"><span><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><div class="url" id="eurl">🔒 baubc &nbsp;/ events</div><span style="width:40px"></span></div>
    <div id="egrid" class="layer" style="top:42px;padding:70px 70px 0;background:linear-gradient(180deg,#F5F8EC,#EAF1D9)">
      <div class="lbl" style="color:var(--leaf)">◆ Events</div><div class="disp" style="font-size:72px;margin-top:10px">What's <span class="serif" style="color:var(--brand)">on next</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:44px">${[1,2,3].map(n=>`<div id="ec${n}" class="card" style="overflow:hidden"><div style="position:relative;height:300px;overflow:hidden"><div id="ecb${n}" class="layer">${banner(n)}</div></div><div style="padding:22px 24px"><div class="disp" style="font-size:30px">Event ${n}</div><div style="font:500 15px Int;color:var(--muted);margin-top:6px">Dec ${['','04','12','20'][n]} · ${['','Hall 1','Main Hall','Room 3'][n]}</div></div></div>`).join('')}</div>
    </div>
    <div id="edet" class="layer" style="top:42px;background:var(--paper)">
      <div style="position:relative;height:360px">${banner(2,true)}</div>
      <div style="display:grid;grid-template-columns:1fr 520px;gap:40px;padding:34px 60px">
        <div><div style="display:flex;gap:10px"><span class="tag" style="background:var(--lime1);color:var(--brand)"><span class="dia"></span>Filling fast</span><span class="tag" style="background:#fff;border:1px solid var(--line)">Dec 12 · 10:00 AM</span></div>
          <div class="disp" style="font-size:68px;margin-top:18px">Event 2: <span class="serif" style="color:var(--brand)">Innovation</span> Summit</div>
          <p style="font-size:19px;line-height:1.6;color:var(--ink-2);margin-top:14px;max-width:640px">Talks, pitches and hands-on sessions. Open to everyone.</p>
